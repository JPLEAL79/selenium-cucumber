services:
  selenium-hub:
    image: selenium/hub:4.21.0-20240521
    container_name: selenium-hub

    # Puertos internos del Grid (event bus + UI)
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

    networks:
      - selenium-grid

  chrome-node:
    image: selenium/node-chrome:4.21.0-20240521
    container_name: chrome-node
    shm_size: 2gb

    # Espera a que el hub esté listo
    depends_on:
      - selenium-hub

    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

    networks:
      - selenium-grid

  firefox-node:
    image: selenium/node-firefox:4.21.0-20240521
    container_name: firefox-node
    shm_size: 2gb

    depends_on:
      - selenium-hub

    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443

    networks:
      - selenium-grid

# Red compartida para CI/CD y Grid
networks:
  selenium-grid:
    external: true
